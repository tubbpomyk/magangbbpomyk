<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instal Presensi BPOM</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d47a1">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/0/02/Logo_Badan_POM.png">
    
    <!-- Memanggil library dan font yang sama agar senada -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background: linear-gradient(135deg, #eef2f3 0%, #dbe6f6 100%); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            text-align: center;
            padding: 20px;
        }
        .install-card { 
            width: 100%; 
            max-width: 400px; 
            padding: 40px 30px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(13, 71, 161, 0.2); 
            background-color: #ffffff; 
            animation: fadeIn 0.8s ease-in-out; 
        }
        .logo-img { width: 100px; height: auto; margin-bottom: 20px; }
        .title { color: #0d47a1; font-weight: 700; font-size: 1.6rem; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 0.95rem; margin-bottom: 30px; line-height: 1.5; }
        .btn-install { 
            background-color: #0d47a1; 
            color: white;
            border: none; 
            padding: 15px; 
            font-size: 1.1rem;
            font-weight: 600; 
            border-radius: 12px; 
            width: 100%;
            transition: all 0.3s ease; 
            box-shadow: 0 4px 15px rgba(13, 71, 161, 0.3);
            display: none; /* Disembunyikan sampai event PWA siap */
        }
        .btn-install:active { transform: scale(0.96); }
        .loading-text { color: #888; font-size: 0.9rem; font-style: italic; }
        .ios-guide {
            display: none;
            background-color: #f8f9fa;
            border: 2px dashed #0d47a1;
            padding: 15px;
            border-radius: 12px;
            text-align: left;
            font-size: 0.9rem;
            color: #333;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="install-card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/02/Logo_Badan_POM.png" alt="Logo" class="logo-img">
        <h2 class="title">Pasang Aplikasi</h2>
        <p class="subtitle">Instal aplikasi Presensi Magang & PKL Balai BPOM di layar utama HP Anda agar lebih cepat diakses.</p>
        
        <!-- Pesan Loading saat menunggu event dari browser -->
        <p id="loadingMsg" class="loading-text"><span class="spinner-border spinner-border-sm me-2"></span> Menyiapkan instalasi...</p>

        <!-- Tombol Utama Instal -->
        <button id="pwaInstallBtn" class="btn-install">
            <i class="bi bi-download me-2"></i> Instal Sekarang
        </button>

        <!-- Panduan khusus iOS -->
        <div id="iosGuide" class="ios-guide mt-3">
            <p class="mb-2 fw-bold text-primary"><i class="bi bi-apple me-1"></i> Pengguna iPhone/iPad:</p>
            1. Ketuk ikon <b>Bagikan</b> <i class="bi bi-share"></i> di bawah layar.<br>
            2. Gulir ke bawah, pilih <b>Tambah ke Layar Utama</b> <i class="bi bi-plus-square"></i>.
        </div>
    </div>

    <script>
        // Mendaftarkan Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log('ServiceWorker siap.'))
                    .catch(err => console.error('ServiceWorker error:', err));
            });
        }

        const installBtn = document.getElementById('pwaInstallBtn');
        const loadingMsg = document.getElementById('loadingMsg');
        const iosGuide = document.getElementById('iosGuide');
        let deferredPrompt;

        // Mendeteksi sistem perangkat
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

        if (isStandalone) {
            // Jika web ini dibuka dari aplikasi yang sudah terinstal, ubah teks menjadi tombol buka aplikasi (meski secara teknis sudah di dalam aplikasi)
            loadingMsg.style.display = 'none';
            document.querySelector('.subtitle').innerHTML = "Aplikasi sudah berhasil terinstal di HP Anda.";
        } else {
            if (isIOS) {
                // Tampilan khusus iOS
                loadingMsg.style.display = 'none';
                iosGuide.style.display = 'block';
            } else {
                // Tampilan Android / Chrome PC
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    deferredPrompt = e;
                    loadingMsg.style.display = 'none';
                    installBtn.style.display = 'block'; // Munculkan tombol
                });

                // Jika event tidak kunjung muncul (mungkin butuh waktu, atau diblokir)
                setTimeout(() => {
                    if(!deferredPrompt && !isIOS) {
                        loadingMsg.innerHTML = "Browser Anda mungkin memerlukan instalasi manual melalui menu browser titik tiga (⋮).";
                    }
                }, 3000);
            }
        }

        // Aksi ketika tombol Instal diklik
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('Aplikasi sukses diinstal');
                    installBtn.style.display = 'none';
                    document.querySelector('.subtitle').innerHTML = "Aplikasi sedang diinstal ke Layar Utama Anda. Silakan cek HP Anda.";
                }
                deferredPrompt = null;
            }
        });

        // Deteksi jika sukses instal dari event sistem
        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
            document.querySelector('.subtitle').innerHTML = "Instalasi berhasil! Silakan tutup halaman ini dan buka aplikasi dari Layar Utama HP Anda.";
        });
    </script>
</body>
</html>
